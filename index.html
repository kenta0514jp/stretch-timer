<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="左右30秒×2〜3セットの大腿四頭筋ストレッチ用インターバルタイマー。音と色で左右の切り替えを知らせます。">
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1319" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- ランジの姿勢のピクトグラム。1px単位で潰れないよう線は太めにしてある -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%20100%20100'><rect width='100' height='100' rx='22' fill='%230F6E68'/><circle cx='36' cy='23' r='10' fill='%23FFFFFF'/><path d='M40%2035%20L53%2056' stroke='%23FFFFFF' stroke-width='11' stroke-linecap='round' fill='none'/><path d='M53%2056%20L26%2083' stroke='%23FFFFFF' stroke-width='11' stroke-linecap='round' fill='none'/><path d='M53%2056%20L74%2064%20L74%2083' stroke='%23FFFFFF' stroke-width='11' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M43%2038%20L65%2042' stroke='%23FFFFFF' stroke-width='9' stroke-linecap='round' fill='none'/></svg>">
<link rel="apple-touch-icon" href="icon-180.png">
<title>大腿四頭筋ストレッチ タイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F4F3EF;
    --surface:#FFFFFF;
    --ink:#14181E;
    --ink-2:#5C6470;
    --ink-3:#8A929E;
    --line:#DCDAD3;
    --right:#B8531A;      --right-ink:#FFFFFF;
    --left:#0F6E68;       --left-ink:#FFFFFF;
    --rest:#6B6478;       --rest-ink:#FFFFFF;
    --btn:#14181E;        --btn-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(20,24,30,.06), 0 8px 24px rgba(20,24,30,.07);
    --num: "Anton", "Noto Sans JP", system-ui, sans-serif;
    --ui: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1319;
      --surface:#181D25;
      --ink:#ECEFF3;
      --ink-2:#98A3B1;
      --ink-3:#6B7684;
      --line:#28303B;
      --right:#E8843C;    --right-ink:#0F1319;
      --left:#3FB3AB;     --left-ink:#0F1319;
      --rest:#9A90AE;     --rest-ink:#0F1319;
      --btn:#ECEFF3;      --btn-ink:#0F1319;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1319;
    --surface:#181D25;
    --ink:#ECEFF3;
    --ink-2:#98A3B1;
    --ink-3:#6B7684;
    --line:#28303B;
    --right:#E8843C;      --right-ink:#0F1319;
    --left:#3FB3AB;       --left-ink:#0F1319;
    --rest:#9A90AE;       --rest-ink:#0F1319;
    --btn:#ECEFF3;        --btn-ink:#0F1319;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--ui);
    margin:0;
    padding-block:22px 34px;
    padding-left:18px; padding-right:18px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  header{display:flex;flex-direction:column;gap:6px}
  .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;
  }
  h1{
    font-size:clamp(20px,5vw,25px);line-height:1.25;margin:0;font-weight:700;
    text-wrap:balance;
  }
  .cue{
    color:var(--ink-2);font-size:13.5px;line-height:1.7;margin:0;
  }
  .cue b{color:var(--ink);font-weight:700}

  /* ---- timer panel ---- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .stage{
    background:var(--stage,var(--surface));
    color:var(--stage-ink,var(--ink));
    padding:26px 20px 20px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:background .35s ease,color .35s ease;
  }
  .panel.side-right .stage{--stage:var(--right);--stage-ink:var(--right-ink)}
  .panel.side-left  .stage{--stage:var(--left); --stage-ink:var(--left-ink)}
  .panel.side-rest  .stage{--stage:var(--rest); --stage-ink:var(--rest-ink)}

  .phase{
    font-size:12px;letter-spacing:.2em;font-weight:700;opacity:.82;
    text-transform:uppercase;
  }
  .side{
    font-family:var(--num);
    font-size:clamp(64px,19vw,104px);
    line-height:.92;
    letter-spacing:.04em;
  }
  .side small{font-family:var(--ui);font-size:.22em;font-weight:700;letter-spacing:.2em;display:block;opacity:.8;margin-top:6px}
  .count{
    font-family:var(--num);
    font-variant-numeric:tabular-nums;
    font-size:clamp(88px,30vw,150px);
    line-height:.86;
    letter-spacing:.01em;
    margin-top:6px;
  }
  .count.pulse{animation:pop .5s ease}
  .count.tick{animation:tick .35s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes tick{0%{transform:scale(1);opacity:.75}30%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .count.pulse,.count.tick{animation:none}
    .stage{transition:none}
  }
  .bar{height:5px;background:color-mix(in srgb,currentColor 24%,transparent);width:100%;margin-top:14px;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:currentColor;width:0%;transition:width .25s linear}

  /* ---- meta row ---- */
  .meta{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink-2);
  }
  .dots{display:flex;gap:7px;align-items:center}
  .dot{
    width:26px;height:6px;border-radius:99px;background:var(--line);
  }
  .dot.done{background:var(--ink-2)}
  .dot.now{background:var(--ink)}
  .total{font-variant-numeric:tabular-nums;font-weight:500}

  /* ---- controls ---- */
  .controls{display:flex;gap:10px}
  button{font-family:var(--ui);font-size:15px;font-weight:700;cursor:pointer;border-radius:12px;border:1px solid var(--line);transition:transform .08s ease}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid var(--ink-3);outline-offset:2px}
  .primary{
    flex:1;background:var(--btn);color:var(--btn-ink);border-color:transparent;
    padding:16px 18px;
  }
  .ghost{
    background:transparent;color:var(--ink-2);padding:16px 18px;min-width:96px;
  }

  /* ---- settings ---- */
  .settings{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .row > span{font-size:13px;color:var(--ink-2);font-weight:500}
  .seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
  .seg button{
    border:0;border-radius:0;background:transparent;color:var(--ink-2);
    padding:9px 15px;font-size:14px;font-variant-numeric:tabular-nums;
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

  .check{justify-content:flex-start;gap:10px}
  .mini{background:transparent;color:var(--ink-2);padding:8px 14px;font-size:13px}
  .note{font-size:12px;line-height:1.5;color:var(--ink-3);flex:1;min-width:180px}
  .note.warn{color:var(--right)}

  footer{color:var(--ink-3);font-size:12px;line-height:1.7}
  footer b{color:var(--ink-2)}
</style>
<style>html,body{min-height:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">下り坂のあとのケア</div>
    <h1>大腿四頭筋ストレッチ</h1>
    <p class="cue">壁に手をつき、<b>片足のかかとをお尻へ</b>。膝を後ろに引くとよく伸びます。<b>痛むところまで引っ張らない</b>こと。</p>
  </header>

  <div class="panel side-right" id="panel">
    <div class="stage">
      <div class="phase" id="phase">準備してください</div>
      <div class="side" id="side">右<small id="sideSub">みぎ足</small></div>
      <div class="count" id="count">30</div>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <div class="meta">
      <div class="dots" id="dots" aria-label="セット進捗"></div>
      <div class="total">のこり <span id="total">3:45</span></div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="go">開始</button>
    <button class="ghost" id="reset">リセット</button>
  </div>

  <div class="settings">
    <div class="row">
      <span>片側の秒数</span>
      <div class="seg" id="segSec">
        <button data-v="20">20秒</button>
        <button data-v="30" aria-pressed="true">30秒</button>
        <button data-v="45">45秒</button>
      </div>
    </div>
    <div class="row">
      <span>セット数</span>
      <div class="seg" id="segSet">
        <button data-v="2">2回</button>
        <button data-v="3" aria-pressed="true">3回</button>
      </div>
    </div>
    <div class="row">
      <span>音</span>
      <div class="seg" id="segSnd">
        <button data-v="1" aria-pressed="true">オン</button>
        <button data-v="0">オフ</button>
      </div>
    </div>
    <div class="row check">
      <button class="ghost mini" id="test">音を確認</button>
      <span class="note" id="sndNote" aria-live="polite"></span>
    </div>
  </div>

  <footer>
    右 → <b>足の入れ替え5秒</b> → 左 を1セット。セット間も<b>5秒</b>で次へ。<br>
    開始と切り替わりは<b>チャイム</b>、<b>残り5秒</b>からはカウント音。画面を見ていなくて大丈夫です。
  </footer>
</div>

<script>
(function(){
  var SEC = 30, SETS = 3, SWITCH = 5, REST = 5, PREP = 5;
  var LEAD = 5;   // 残り何秒からカウント音を鳴らすか

  var panel=document.getElementById('panel'), phaseEl=document.getElementById('phase'),
      sideEl=document.getElementById('side'), subEl=document.getElementById('sideSub'),
      countEl=document.getElementById('count'), fill=document.getElementById('fill'),
      dots=document.getElementById('dots'), totalEl=document.getElementById('total'),
      go=document.getElementById('go'), reset=document.getElementById('reset'),
      testBtn=document.getElementById('test'), noteEl=document.getElementById('sndNote');

  var plan=[], idx=0, left=0, running=false, tick=null, deadline=0, wake=null;
  var ac=null, master=null, sound=true, silent=null;
  var iOS=/iP(hone|ad|od)/.test(navigator.platform||'') ||
          (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform||''));

  function build(){
    plan=[{k:'prep',t:PREP}];
    for(var s=1;s<=SETS;s++){
      plan.push({k:'right',t:SEC,set:s});
      plan.push({k:'switch',t:SWITCH,set:s});
      plan.push({k:'left',t:SEC,set:s});
      if(s<SETS) plan.push({k:'rest',t:REST,set:s});
    }
    plan.push({k:'done',t:0});
    idx=0; left=plan[0].t;
    dots.innerHTML='';
    for(var i=0;i<SETS;i++){var d=document.createElement('div');d.className='dot';dots.appendChild(d);}
    render();
  }

  function mmss(n){var m=Math.floor(n/60),s=n%60;return m+':'+(s<10?'0':'')+s;}

  function remaining(){
    var r=left;
    for(var i=idx+1;i<plan.length;i++) r+=plan[i].t;
    return r;
  }

  function render(pulse){
    var p=plan[idx];
    panel.className='panel ' + (p.k==='right'?'side-right':p.k==='left'?'side-left':'side-rest');
    var label={prep:'準備してください',right:'伸ばす',left:'伸ばす',switch:'足を入れ替える',rest:'足を入れ替える',done:'おつかれさまでした'}[p.k];
    phaseEl.textContent = p.set ? label+'　'+p.set+'/'+SETS+'セット目' : label;

    if(p.k==='right'){ sideEl.firstChild.nodeValue='右'; subEl.textContent='みぎ足'; }
    else if(p.k==='left'){ sideEl.firstChild.nodeValue='左'; subEl.textContent='ひだり足'; }
    else if(p.k==='switch'){ sideEl.firstChild.nodeValue='交代'; subEl.textContent='右 → 左'; }
    else if(p.k==='rest'){ sideEl.firstChild.nodeValue='交代'; subEl.textContent='左 → 右'; }
    else if(p.k==='done'){ sideEl.firstChild.nodeValue='完'; subEl.textContent=SETS+'セット終了'; }
    else { sideEl.firstChild.nodeValue='右'; subEl.textContent='みぎ足から'; }

    countEl.textContent = p.k==='done' ? '✓' : left;
    countEl.classList.remove('pulse','tick');
    if(pulse){ void countEl.offsetWidth; countEl.classList.add(pulse==='tick'?'tick':'pulse'); }
    fill.style.width = p.t ? ((p.t-left)/p.t*100)+'%' : '100%';
    totalEl.textContent = mmss(remaining());

    var ds=dots.children;
    for(var i=0;i<ds.length;i++){
      ds[i].className='dot';
      var cur=p.set||0;
      if(i+1<cur || p.k==='done') ds[i].className='dot done';
      else if(i+1===cur) ds[i].className='dot now';
    }
    go.textContent = p.k==='done' ? 'もう一度' : (running?'一時停止':(idx===0&&left===PREP?'開始':'再開'));
  }

  /* ---- 音 ----
     AudioContext はユーザー操作の中で作る／再開する。
     iOS の消音（マナーモード）スイッチは Web Audio も止めてしまうので、
     Audio Session API で playback を宣言し、無音の <audio> も一度再生して
     オーディオセッションを起こしておく。*/
  var SILENT='data:audio/wav;base64,UklGRuwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YcgAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';

  function unlockMedia(){
    try{
      if(!silent){
        silent=new Audio(SILENT);
        silent.setAttribute('playsinline','');
        silent.volume=0.01;
      }
      var pr=silent.play();
      if(pr && pr.catch) pr.catch(function(){});
    }catch(e){}
  }

  function audio(){
    try{
      // Safari 16.4+ / iOS 16.4+。消音スイッチに邪魔されないようにする
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
      unlockMedia();
      if(!ac){
        var AC=window.AudioContext||window.webkitAudioContext;
        if(!AC) return null;
        ac=new AC();
        master=ac.createGain();
        // コンプレッサーは通さない。立ち上がりを潰して芯がなくなるため。
        // 音が重なっても振幅は 0.5 程度までなので歪まない
        master.gain.value=0.9;
        master.connect(ac.destination);
      }
      if(ac.state==='suspended') ac.resume().catch(function(){});
      return ac;
    }catch(e){ return null; }
  }

  // 鳴らせる状態かどうかを画面に出す（鳴らない原因が分かるように）
  function note(msg,warn){
    noteEl.textContent=msg;
    noteEl.className='note'+(warn?' warn':'');
  }
  function sndStatus(tested){
    if(!sound){ note('音はオフです'); return; }
    if(!(window.AudioContext||window.webkitAudioContext)){ note('このブラウザは音を出せません',true); return; }
    if(!ac){ note('「開始」か「音を確認」を押すと鳴ります'); return; }
    if(ac.state!=='running'){ note('ブラウザが音を止めています。もう一度押してください',true); return; }
    note(tested
      ? (iOS ? '鳴らしました。聞こえないときは本体横のマナーモードスイッチと音量を確認してください'
             : '鳴らしました。聞こえないときは端末とブラウザの音量を確認してください')
      : '音の準備ができました');
  }

  // 単音。立ち上がり → 音量を保つ（ここが音の芯）→ 減衰
  function tone(freq,dur,vol,delay,type,hold){
    var a=sound?audio():null; if(!a) return;
    try{
      var t0=a.currentTime+(delay||0), atk=0.006;
      var o=a.createOscillator(), g=a.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(freq,t0);   // 周波数は動かさない
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+atk);
      g.gain.setValueAtTime(vol,t0+atk+(hold||0));
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0+dur+0.03);
    }catch(e){}
  }
  // 倍音は厳密な整数倍。整数からずらすと鐘のように音程がぼやけて聞こえる
  function chime(freq,dur,vol,delay){
    vol=vol||0.24;
    tone(freq,dur,vol,delay,'triangle',Math.min(0.14,dur*0.4));
    tone(freq*2,dur*0.55,vol*0.20,delay,'sine',0);
    tone(freq*3,dur*0.30,vol*0.07,delay,'sine',0);
  }
  // 時報のような短いピッ
  function pip(freq,vol){
    vol=vol||0.20;
    tone(freq,0.13,vol,0,'triangle',0.05);
    tone(freq*2,0.09,vol*0.16,0,'sine',0);
  }
  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  // 平均律のCメジャー。半音を使わないので音程が素直に聞こえる
  var C5=523.25, E5=659.25, G5=784.00, A5=880.00, C6=1046.50;

  // 残り5〜1秒は同じ高さで5回。時報と同じ考え方で、上がり下がりさせない
  function countTick(n){
    pip(A5);
    if(n<=3) buzz(40);
  }

  function cue(kind){
    if(kind==='right'||kind==='left'){ chime(C6,0.90,0.26); buzz(180); }                          // ポーン（1オクターブ上で区切る）
    else if(kind==='switch'||kind==='rest'){ chime(G5,0.35,0.22); chime(E5,0.65,0.22,0.16); buzz([90,60,90]); }  // ソ→ミ
    else if(kind==='done'){ chime(C5,0.30,0.24); chime(E5,0.30,0.24,0.16); chime(G5,0.30,0.24,0.32); chime(C6,1.20,0.26,0.48); buzz([160,80,160,80,260]); }  // ド・ミ・ソ・ド
  }
  function startCue(){ chime(G5,0.35,0.24); chime(C6,0.90,0.26,0.16); buzz(80); }   // ソ→ド（完全4度）のピ・ポーン

  /* ---- 進行 ---- */
  function step(quiet){
    var kind = plan[idx].k;
    left--;
    if(left<=0){
      idx++;
      if(idx>=plan.length-1){ idx=plan.length-1; left=0; stop(); if(!quiet) cue('done'); render(true); return; }
      left=plan[idx].t;
      if(!quiet) cue(plan[idx].k);
      render(true);
      return;
    }
    if(left<=LEAD && kind!=='done'){ if(!quiet) countTick(left); render('tick'); return; }
    render();
  }

  // 秒の刻みは実時間に合わせる（setInterval のずれ・バックグラウンドでの間引き対策）
  function pump(){
    if(!running) return;
    var n=0;
    while(Date.now()>=deadline && n<3600){ deadline+=1000; n++; }
    // 間引かれて何秒分もまとめて進むときは、最後の1回だけ音を出す
    for(var i=0;i<n && running;i++) step(i<n-1);
  }

  function start(){
    audio();                       // ユーザー操作の中で音を起こしておく
    sndStatus();
    if(plan[idx].k==='done'){ build(); }
    running=true;
    startCue();
    if(tick) clearInterval(tick);
    deadline=Date.now()+1000;
    tick=setInterval(pump,100);
    lock();
    render();
  }
  function stop(){
    running=false;
    if(tick){ clearInterval(tick); tick=null; }
    unlock();
    render();
  }

  function lock(){
    try{ if(navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function(s){wake=s;}).catch(function(){}); }catch(e){}
  }
  function unlock(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }

  go.addEventListener('click',function(){ running?stop():start(); });
  reset.addEventListener('click',function(){ audio(); stop(); build(); });

  function seg(el,cb){
    el.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      [].forEach.call(el.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed', x===b?'true':'false');});
      cb(parseInt(b.dataset.v,10));
    });
  }
  seg(document.getElementById('segSec'),function(v){ SEC=v; stop(); build(); save(); });
  seg(document.getElementById('segSet'),function(v){ SETS=v; stop(); build(); save(); });
  seg(document.getElementById('segSnd'),function(v){
    sound=!!v;
    if(sound){ audio(); chime(A5,0.6,0.24); }   // オンにしたら試し鳴らし
    setTimeout(function(){ sndStatus(sound); },60);
    save();
  });

  testBtn.addEventListener('click',function(){
    if(!sound){ note('音がオフです。「オン」にしてください',true); return; }
    audio();
    startCue();
    setTimeout(function(){ sndStatus(true); },60);
  });

  // 最初のタップ／クリックで音を起こしておく（自動再生の制限対策）
  ['pointerdown','touchend','keydown'].forEach(function(ev){
    document.addEventListener(ev,function once(){ audio(); sndStatus(); },{once:true,passive:true});
  });

  function save(){ try{ localStorage.setItem('quadTimer',JSON.stringify({SEC:SEC,SETS:SETS,SND:sound?1:0})); }catch(e){} }
  function load(){
    try{
      var o=JSON.parse(localStorage.getItem('quadTimer')||'null');
      if(!o) return;
      if(o.SEC){ SEC=o.SEC; SETS=o.SETS;
        [].forEach.call(document.querySelectorAll('#segSec button'),function(b){b.setAttribute('aria-pressed',+b.dataset.v===SEC?'true':'false');});
        [].forEach.call(document.querySelectorAll('#segSet button'),function(b){b.setAttribute('aria-pressed',+b.dataset.v===SETS?'true':'false');});
      }
      if(o.SND!==undefined){ sound=!!o.SND;
        [].forEach.call(document.querySelectorAll('#segSnd button'),function(b){b.setAttribute('aria-pressed',(+b.dataset.v===1)===sound?'true':'false');});
      }
    }catch(e){}
  }

  document.addEventListener('visibilitychange',function(){
    if(document.hidden || !running) return;
    lock();
    if(ac && ac.state==='suspended') ac.resume().catch(function(){ sndStatus(); });
    pump();                        // 戻ってきたら実時間に追いつく
  });

  load(); build(); sndStatus();
})();
</script>
</body>
</html>
